name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.9.3" "modbus-connection>=4.12.1" ruff

      - name: Compile Python files
        run: python -m compileall -q custom_components

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("custom_components/varta_storage").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          print("JSON validation passed")
          PY

      - name: Ruff
        run: ruff check custom_components/varta_storage
